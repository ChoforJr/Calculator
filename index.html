<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="theme-color"
      content="#10131b"
    />
    <meta
      name="description"
      content="A clean, modern calculator for quick everyday math."
    />
    <link rel="stylesheet" href="style.css" />
    <script src="dist/script.js" type="module"></script>
    <title>Orbit — Calculator</title>
  </head>
  <body>
    <main class="app-shell">
      <section class="calculator" aria-label="Calculator">
        <header class="topbar">
          <a class="brand" href="./" aria-label="Orbit calculator home">
            <span class="brand-mark" aria-hidden="true">o</span>
            <span>orbit</span>
          </a>
          <span class="mode-label"><span class="status-dot"></span> Standard</span>
        </header>

        <div class="display" aria-live="polite" aria-atomic="true">
          <p class="expression" id="expression">Ready when you are</p>
          <output class="result" id="result" aria-label="Display">0</output>
        </div>

        <div class="keypad" aria-label="Calculator keys">
          <button class="key key-utility" type="button" data-action="clear" aria-label="All clear">AC</button>
          <button class="key key-utility" type="button" data-action="sign" aria-label="Change sign">+/−</button>
          <button class="key key-utility" type="button" data-action="percent" aria-label="Percent">%</button>
          <button class="key key-operator" type="button" data-operator="/" aria-label="Divide">÷</button>

          <button class="key" type="button" data-digit="7">7</button>
          <button class="key" type="button" data-digit="8">8</button>
          <button class="key" type="button" data-digit="9">9</button>
          <button class="key key-operator" type="button" data-operator="*" aria-label="Multiply">×</button>

          <button class="key" type="button" data-digit="4">4</button>
          <button class="key" type="button" data-digit="5">5</button>
          <button class="key" type="button" data-digit="6">6</button>
          <button class="key key-operator" type="button" data-operator="-" aria-label="Subtract">−</button>

          <button class="key" type="button" data-digit="1">1</button>
          <button class="key" type="button" data-digit="2">2</button>
          <button class="key" type="button" data-digit="3">3</button>
          <button class="key key-operator" type="button" data-operator="+" aria-label="Add">+</button>

          <button class="key key-utility key-backspace" type="button" data-action="backspace" aria-label="Backspace">⌫</button>
          <button class="key" type="button" data-digit="0">0</button>
          <button class="key" type="button" data-action="decimal" aria-label="Decimal point">.</button>
          <button class="key key-equals" type="button" data-action="equals" aria-label="Equals">=</button>
        </div>

        <footer class="hint">Tip: use your keyboard · Esc to clear</footer>
      </section>
    </main>
  </body>
</html>
